<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Branchwork — navigasi saja</title>
<style>
:root{--ah:215;--bh:265;--bg:oklch(.18 .006 var(--bh));--surface:oklch(.205 .011 var(--bh));--raised:oklch(.245 .012 var(--bh));--overlay:oklch(.27 .013 var(--bh));--border:oklch(1 0 0/.11);--border2:oklch(1 0 0/.2);--text:oklch(.92 .004 var(--bh));--text2:oklch(.8 .01 var(--bh));--text3:oklch(.7 .012 var(--bh));--acc:oklch(.7 .14 var(--ah));--accStrong:oklch(.62 .18 var(--ah));--sel:oklch(.68 .17 var(--ah)/.18);--ok:oklch(.76 .15 155);--warn:oklch(.82 .14 80);--bad:oklch(.72 .17 25);--info:oklch(.76 .12 230);--agent:oklch(.76 .14 300)}
*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{height:100dvh;display:grid;grid-template-rows:44px minmax(0,1fr) 26px}
.titlebar{display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.traffic{width:74px;flex:none}.crumb{display:flex;align-items:center;gap:5px;min-width:0;color:var(--text2);font-size:13px}.crumb button{padding:4px 6px;border-radius:6px}.crumb button:hover{background:oklch(1 0 0/.06);color:var(--text)}.crumb .cur{color:var(--text);font-weight:600}.search{flex:0 1 420px;margin:0 auto;height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text3)}.search kbd{margin-left:auto}.icon-btn{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--text2)}.icon-btn:hover{background:oklch(1 0 0/.06);color:var(--text)}
.body{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:0}.sidebar{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--surface)}.side-scroll{flex:1;overflow:auto;padding:12px 8px}.brand{display:flex;align-items:center;gap:8px;padding:2px 10px 10px}.mark{width:18px;height:18px;border-radius:5px;background:var(--text);mask:linear-gradient(#000,#000);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}.brand strong{font-weight:650}
.picker{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--raised);text-align:left}.picker .pmark{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:700}.picker small{display:block;color:var(--text2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.picker .copy{flex:1;min-width:0}
.h{padding:14px 10px 4px;color:var(--text3);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.prow{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:8px;text-align:left;color:var(--text2)}.prow:hover{background:var(--raised);color:var(--text)}.prow.on{background:var(--sel);color:var(--text)}.prow .pm{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}.prow small{display:block;color:var(--text3);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;color:var(--text2)}.wt:hover{background:var(--raised)}.wt.on{background:var(--raised);box-shadow:inset 0 0 0 1px var(--border2);color:var(--text)}.wt .stripe{width:3px;align-self:stretch;border-radius:2px}.wt .name{font:600 12px ui-monospace,Menlo,monospace;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wt .meta{font-size:11px;color:var(--text3);white-space:nowrap}.wt .chip{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--raised);color:var(--text2)}.wt .chip.w{background:color-mix(in oklch,var(--warn) 18%,transparent);color:var(--warn)}.wt .chip.b{background:color-mix(in oklch,var(--bad) 18%,transparent);color:var(--bad)}
.nav{display:flex;align-items:center;gap:8px;width:100%;min-height:30px;padding:0 10px;border-radius:6px;color:var(--text);text-align:left}.nav:hover{background:oklch(1 0 0/.06)}.nav.on{background:var(--sel);font-weight:600}.nav .ic{width:18px;text-align:center;color:var(--text2)}.nav .k{margin-left:auto;color:var(--text3);font-size:11px}.nav .badge{min-width:18px;height:18px;padding:0 5px;border-radius:99px;display:grid;place-items:center;background:color-mix(in oklch,var(--warn) 25%,transparent);color:var(--warn);font-size:11px;font-weight:700}.side-foot{padding:8px;border-top:1px solid var(--border)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}.tabs{display:flex;align-items:stretch;gap:2px;height:42px;padding:0 10px;border-bottom:1px solid var(--border);background:var(--surface)}.tab{display:flex;align-items:center;gap:8px;min-width:130px;padding:0 10px;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;color:var(--text2)}.tab.active{border-color:var(--border);background:var(--surface);color:var(--text);font-weight:600}.tab .x{margin-left:auto;color:var(--text3)}.tabs .add{width:34px;display:grid;place-items:center}
.stage{flex:1;min-height:0;display:grid}.pane{display:grid;grid-template-rows:minmax(44px,max-content) minmax(0,1fr);margin:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden}.pane-head{display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;border-bottom:1px solid var(--border)}.pane-title{font-size:15px;font-weight:650}.ctx{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--border);border-radius:99px;color:var(--text2);font-size:12px}.pane-head .tools{margin-left:auto;display:flex;gap:6px;align-items:center}.btn{height:28px;padding:0 11px;border:1px solid var(--border2);border-radius:6px;background:var(--raised);font-weight:500}.btn:hover{background:var(--overlay)}.btn.primary{background:var(--acc);border-color:var(--acc);color:#101a24;font-weight:650}.pane-body{overflow:auto;padding:14px}
.splitview{display:grid;grid-template-columns:minmax(230px,.85fr) minmax(320px,1.6fr);height:100%;min-height:0}.list{border-right:1px solid var(--border);padding:6px;overflow:auto}.file{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px}.file:hover{background:var(--raised)}.file .st{margin-left:auto;color:var(--text3)}.diff{font:12px/1.6 ui-monospace,Menlo,monospace;padding:8px 0;overflow:auto}.diff div{padding:0 16px;white-space:pre-wrap}.diff .add{background:color-mix(in oklch,var(--ok) 12%,transparent)}.diff .del{background:color-mix(in oklch,var(--bad) 12%,transparent)}
.card{border:1px solid var(--border);border-radius:10px;background:var(--raised);padding:12px}.card h3{margin:0 0 8px;font-size:15px}.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}.row:last-child{border-bottom:0}.muted{color:var(--text2)}.faint{color:var(--text3)}.status{display:flex;align-items:center;gap:12px;padding:0 12px;border-top:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:12px}.status .grow{flex:1}.num{font-variant-numeric:tabular-nums}
.backdrop{position:fixed;inset:0;z-index:20;background:oklch(0 0 0/.35)}.palette{position:fixed;z-index:21;left:50%;top:8vh;transform:translateX(-50%);width:min(640px,92vw);border-radius:10px;background:var(--overlay);border:1px solid var(--border2);box-shadow:0 24px 60px -20px oklch(0 0 0/.55);overflow:hidden}.pal-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}.pal-head input{flex:1;background:transparent;border:0;outline:0;font-size:16px}.pal-list{max-height:55vh;overflow:auto;padding:6px}.pal-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;text-align:left}.pal-item:hover,.pal-item.sel{background:var(--acc);color:#101a24}.pal-item .ic{width:26px;height:26px;display:grid;place-items:center;border-radius:7px;background:var(--raised)}.pal-item.sel .ic{background:oklch(1 0 0/.2)}.pal-item .meta{margin-left:auto;color:var(--text3);font-size:11px}.pal-item.sel .meta{color:inherit;opacity:.75}.sec{padding:8px 10px 2px;color:var(--text3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}.pal-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--border2);color:var(--text3);font-size:12px}.pal-foot b{color:var(--text2);font-weight:500}.att{width:18px;text-align:center}.note{padding:10px 14px;border-top:1px solid var(--border);color:var(--text2);font-size:12px}
@media(max-width:900px){.body{grid-template-columns:64px minmax(0,1fr)}.sidebar .brand span:last-child,.picker .copy,.h,.prow .pm,.wt .meta,.nav .lbl,.nav .k{display:none}.prow,.wt,.nav{justify-content:center}.splitview{grid-template-columns:1fr}.list{border-right:0;border-bottom:1px solid var(--border)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style></head><body>
<div class="app"><header class="titlebar"><div class="traffic"></div><nav class="crumb" aria-label="Konteks"><button id="crumbProject">web-app</button><span>›</span><button class="cur" id="crumbWorktree">main ▾</button></nav><button class="search" id="jumpBtn"><span>⌕</span><span>Jump to project, worktree, or session…</span><kbd>⌘J</kbd></button><button class="icon-btn" aria-label="Theme">◐</button><button class="icon-btn" aria-label="Help">?</button></header>
<div class="body"><aside class="sidebar" aria-label="Sidebar"><div class="side-scroll"><div class="brand"><span class="mark"></span><span>Branchwork</span></div>
<button class="picker" id="pickerBtn"><span class="pmark" id="pickerMark" style="background:var(--acc)">W</span><span class="copy"><strong id="pickerName">web-app</strong><small>Acme · Work · 3 projects</small></span><span aria-hidden="true">▾</span></button>
<div class="h">Projects <span>all visible</span></div><div id="projectList"></div>
<div class="h">Worktrees <span>3</span></div><div id="worktreeList"></div>
<div class="h">Focus</div><div id="focusNav"></div><div class="h">Review</div><div id="reviewNav"></div><div class="h">Run</div><div id="runNav"></div>
</div><div class="side-foot"><button class="nav" data-nav="settings"><span class="ic">⚙</span><span class="lbl">Settings</span></button></div></aside>
<main class="main"><div class="tabs" id="tabs"></div><section class="stage" id="stage"></section></main></div>
<footer class="status"><span>⎇ main</span><span class="num">● 3 changed</span><span class="num">↑2 ↓1</span><span class="grow"></span><span>✦ 2 agents · 1 waiting</span><button class="icon-btn" aria-label="Terminal dock">❯<kbd>Ctrl+`</kbd></button></footer></div>
<div id="overlayRoot"></div><div id="toastRoot"></div>
<script>
"use strict";const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const PROJECTS=[{n:"web-app",o:"acme",g:"Acme · Work",c:"#5b8eea",pr:4},{n:"api",o:"acme",g:"Acme · Work",c:"#3fae6b",pr:2},{n:"design-system",o:"acme",g:"Acme · Work",c:"#d56cae"},{n:"blog",o:"rozzy",g:"Personal",c:"#e4b73d"},{n:"dotfiles",o:"rozzy",g:"Personal",c:"#6db3f2"},{n:"pos-app",o:"nusantara",g:"Client · Nusantara",c:"#f0a35e",pr:3},{n:"landing",o:"nusantara",g:"Client · Nusantara",c:"#9b7bd4"},{n:"scratch",o:"local",g:"Tanpa grup",c:"#7a7a7a"}];
const WORKTREES=[{name:"main",path:"~/web-app",state:"",dirty:0},{name:"feat/auth-oauth",path:"~/wt/auth-oauth",state:"● 3",dirty:3},{name:"fix/cart-total",path:"~/wt/cart-total",state:"Conflict",dirty:2},{name:"exp/redis-cache",path:"~/wt/redis-cache",state:"✓ clean",dirty:0}];
const NAV={focus:[["home","⌂","Home","⌘1"],["files","▤","Files","⌘4"],["history","⎇","History","⌘3"]],review:[["changes","±","Changes","⌘2"],["github","◫","GitHub","⌘7"],["conflicts","⚠","Conflicts",""]],run:[["agents","✦","Agents","⌘5"],["terminal","❯_","Terminal","⌘6"],["browser","◎","Browser",""]]};
const S={screen:"changes",tab:"main",project:"web-app",worktree:"main",recent:["blog","web-app","api"],index:-1,items:[]};
const stageTabs={main:{name:"Main",screen:"changes"},auth:{name:"Auth",screen:"agents"}};
function toast(msg){const t=document.createElement("div");t.className="card";t.style.cssText="position:fixed;right:20px;bottom:38px;z-index:50;padding:10px 14px";t.textContent=msg;$("#toastRoot").append(t);setTimeout(()=>t.remove(),2400)}
function renderProjects(){$("#projectList").innerHTML=PROJECTS.map(p=>`<button class="prow ${p.n===S.project?"on":""}" data-p="${p.n}"><span class="pm" style="background:${p.c}">${p.n[0].toUpperCase()}</span><span><strong style="font-weight:550">${p.n}</strong><small>${p.g}</small></span>${p.pr?`<span class="chip" style="margin-left:auto">${p.pr} PR</span>`:""}</button>`).join("");$$("#projectList .prow").forEach(b=>b.onclick=()=>openProject(b.dataset.p))}
function renderWorktrees(){$("#worktreeList").innerHTML=WORKTREES.map((w,i)=>`<button class="wt ${w.name===S.worktree?"on":""}" data-w="${w.name}"><span class="stripe" style="background:${["var(--acc)","var(--ok)","var(--bad)","var(--agent)"][i]}"></span><span style="min-width:0"><span class="name">${w.name}</span><div class="meta">${w.path}</div></span>${w.state?`<span class="chip ${w.state==="Conflict"?"b":w.dirty?"w":""}">${w.state}</span>`:""}</button>`).join("");$$("#worktreeList .wt").forEach(b=>b.onclick=()=>{S.worktree=b.dataset.w;$("#crumbWorktree").textContent=S.worktree+" ▾";renderWorktrees()})}
function navHtml(items,group){return items.map(([id,ic,lbl,k])=>`<button class="nav ${S.screen===id?"on":""}" data-nav="${id}"><span class="ic">${ic}</span><span class="lbl">${lbl}</span>${k?`<span class="k">${k}</span>`:""}${id==="changes"?'<span class="badge">3</span>':""}${id==="agents"?'<span class="badge">1</span>':""}</button>`).join("")}
function renderNav(){$("#focusNav").innerHTML=navHtml(NAV.focus);$("#reviewNav").innerHTML=navHtml(NAV.review);$("#runNav").innerHTML=navHtml(NAV.run);$$(".nav[data-nav]").forEach(b=>b.onclick=()=>go(b.dataset.nav))}
function renderTabs(){$("#tabs").innerHTML=Object.entries(stageTabs).map(([id,t])=>`<button class="tab ${S.tab===id?"active":""}" data-tab="${id}">${t.name}${id==="auth"?'<span class="att" aria-label="waiting">?</span>':''}<span class="x" aria-hidden="true">×</span></button>`).join("")+`<button class="icon-btn add" aria-label="New stage tab">+</button>`;$$(".tab").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.screen=stageTabs[S.tab].screen;renderStage()})}
function mainHtml(){if(S.screen==="changes")return `<div class="splitview"><div class="list"><div class="sec">Changed</div><div class="file"><span class="mono">src/auth/callback.ts</span><span class="st">M</span></div><div class="file"><span class="mono">src/auth/session.ts</span><span class="st">A</span></div></div><div class="diff"><div>-const session = loadSession()</div><div class="add">+const session = await loadSession()</div><div class="add">+if (!session) return redirect('/login')</div></div></div>`;if(S.screen==="agents")return `<div class="card"><h3>Claude · web-app</h3><div class="mono" style="white-space:pre-wrap">Waiting for input…<br><span class="faint">auth is waiting for your reply</span></div></div>`;if(S.screen==="files")return `<div class="card"><h3>Files</h3><div class="row"><span>src</span><span class="faint">folder</span></div><div class="row"><span>package.json</span><span class="faint">4 KB</span></div></div>`;if(S.screen==="history")return `<div class="card"><h3>History</h3><div class="row"><span class="mono">3c4d8e1</span><span>feat: add GitHub OAuth provider</span><span class="faint" style="margin-left:auto">5m</span></div></div>`;if(S.screen==="terminal")return `<div class="card mono">❯ pnpm test<br><span style="color:var(--ok)">✓ 42 passed</span> <span class="faint">2.4s</span></div>`;if(S.screen==="github")return `<div class="card"><h3>Pull requests</h3><div class="row"><span>#482 Add GitHub OAuth login</span><span class="chip" style="margin-left:auto">review</span></div></div>`;if(S.screen==="browser")return `<div class="card"><h3>Browser</h3><div class="row"><span class="mono">https://developer.mozilla.org</span><button class="btn" style="margin-left:auto">Open</button></div></div>`;if(S.screen==="conflicts")return `<div class="card"><h3>Resolve conflicts</h3><p class="muted">2 files conflict.</p><button class="btn primary">Resolve</button></div>`;if(S.screen==="settings")return `<div class="card"><h3>Theme</h3><div class="row"><span>Mode</span><span style="margin-left:auto">Dark</span></div><div class="row"><span>Accent hue</span><span style="margin-left:auto">215</span></div></div>`;return `<div class="card"><h3>Focus today</h3><div class="row"><span>3 changes in web-app</span><span class="chip" style="margin-left:auto">Changes</span></div><div class="row"><span>1 agent waiting</span><span class="chip" style="margin-left:auto">Agents</span></div></div>`}
function renderStage(){$("#stage").innerHTML=`<section class="pane"><div class="pane-head"><span class="pane-title">${NAV.focus.concat(NAV.review,NAV.run).find(n=>n[0]===S.screen)?.[2]||S.screen[0].toUpperCase()+S.screen.slice(1)}</span><button class="ctx" id="paneCtx"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:var(--acc)"></span><span>${S.project}</span><span class="faint">/</span><span>${S.worktree}</span></button><span class="tools"><button class="btn" id="splitBtn">◨ Split</button><button class="icon-btn" aria-label="More actions">⋯</button></span></div><div class="pane-body">${mainHtml()}</div></section>`;renderTabs();$("#paneCtx").onclick=openJump;$("#splitBtn").onclick=()=>toast("Split view: drag a screen to a pane edge")}
function go(id){S.screen=id;stageTabs[S.tab].screen=id;renderNav();renderStage()}
function openProject(n){const p=PROJECTS.find(x=>x.n===n);if(!p)return;S.project=n;S.worktree="main";S.recent=[n,...S.recent.filter(x=>x!==n)].slice(0,5);$("#crumbProject").textContent=n;$("#pickerName").textContent=n;$("#pickerMark").textContent=n[0].toUpperCase();$("#crumbWorktree").textContent=S.worktree+" ▾";closeJump();renderProjects();renderStage();toast("Pindah ke "+p.o+"/"+n)}
function rowHtml(kind,p,meta,badge){return `<button class="pal-item" data-kind="${kind}" data-id="${p.n||p.name}"><span class="ic">${kind==="project"?"◫":kind==="worktree"?"⎇":kind==="agent"?"✦":"❯_"}</span><span><b>${p.n||p.name}</b><small style="display:block;color:var(--text3)">${meta}</small></span>${badge?`<span class="att" aria-label="${badge}">${badge}</span>`:""}<span class="meta">${kind}</span></button>`}
function renderJump(q){
 const needle=(q||"").toLowerCase();const recents=S.recent.map(n=>PROJECTS.find(p=>p.n===n)).filter(Boolean);const others=PROJECTS.filter(p=>!S.recent.includes(p.n));
 const projects=needle?PROJECTS.filter(p=>(p.o+"/"+p.n+" "+p.g).toLowerCase().includes(needle)):recents;
 const worktrees=needle?WORKTREES.filter(w=>(w.name+" "+w.path).toLowerCase().includes(needle)):WORKTREES;
 const sessions=[{n:"claude-auth",meta:"Agents · waiting",badge:"?"},{n:"codex-cart",meta:"Terminal · running",badge:""},{n:"shell",meta:"Terminal · idle",badge:""}].filter(s=>!needle||s.n.includes(needle));
 const tabs=[{n:"Main",meta:"Stage tab"},{n:"Auth",meta:"Stage tab · ?"}].filter(t=>!needle||t.n.toLowerCase().includes(needle));
 let h="";if(!needle)h+=`<div class="sec">Needs attention</div>`+rowHtml("agent",sessions[0],sessions[0].meta,"?");
 if(!needle)h+=`<div class="sec">Recent projects</div>`+projects.map(p=>rowHtml("project",p,`${p.o}/${p.n} · ${p.g}`)).join("");
 else h+=`<div class="sec">Projects</div>`+projects.map(p=>rowHtml("project",p,`${p.o}/${p.n} · ${p.g}`)).join("");
 if(worktrees.length)h+=`<div class="sec">Worktrees</div>`+worktrees.map(w=>rowHtml("worktree",w,`${S.project} · ${w.path}`)).join("");
 if(sessions.length)h+=`<div class="sec">Chats & terminals</div>`+sessions.map(s=>rowHtml("agent",s,s.meta,s.badge)).join("");
 if(tabs.length)h+=`<div class="sec">Tabs</div>`+tabs.map(t=>rowHtml("tab",t,t.meta)).join("");
 $("#jumpList").innerHTML=h||`<div class="empty">Tidak ada hasil</div>`;
 S.items=[...$$("#jumpList .pal-item")].map(r=>({kind:r.dataset.kind,id:r.dataset.id}));S.index=-1;
}
function openJump(){const root=$("#overlayRoot");root.innerHTML=`<div class="backdrop" id="jumpBackdrop"></div><div class="palette" role="dialog" aria-label="Jump anywhere"><div class="pal-head"><span aria-hidden="true">⌕</span><input id="jumpInput" placeholder="repo / worktree" autocomplete="off"><kbd>Esc</kbd></div><div class="pal-list" id="jumpList"></div><div class="pal-foot"><span><b>↑↓</b> pilih</span><span><b>Enter</b> buka</span><span><b>⌘⇧P</b> toggle project</span></div></div>`;
 const inp=$("#jumpInput");renderJump("");inp.focus();inp.addEventListener("input",()=>renderJump(inp.value));inp.addEventListener("keydown",e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(S.items.length){S.index=((S.index??-1)+(e.key==="ArrowDown"?1:-1)+S.items.length)%S.items.length;paintJump()}}else if(e.key==="Enter"){const it=S.items[S.index??-1];if(it)chooseJump(it)}else if(e.key==="Escape")closeJump()});
 $("#jumpBackdrop").onclick=closeJump;$$("#jumpList .pal-item").forEach(r=>r.onclick=()=>chooseJump({kind:r.dataset.kind,id:r.dataset.id}))}
function paintJump(){$$("#jumpList .pal-item").forEach((r,i)=>{const on=i===S.index;r.classList.toggle("sel",on);if(on&&r.scrollIntoView)r.scrollIntoView({block:"nearest"})})}
function chooseJump(it){if(it.kind==="project")openProject(it.id);else if(it.kind==="worktree"){S.worktree=it.id;$("#crumbWorktree").textContent=it.id+" ▾";renderWorktrees();closeJump()}else{closeJump();go(it.kind==="agent"?"agents":"terminal");toast("Opened "+it.id)}}
function closeJump(){$("#overlayRoot").innerHTML=""}
$("#jumpBtn").onclick=openJump;$("#crumbProject").onclick=openJump;$("#crumbWorktree").onclick=openJump;$("#pickerBtn").onclick=openJump;
renderProjects();renderWorktrees();renderNav();renderStage();
</script></body></html>
