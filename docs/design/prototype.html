<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Branchwork Prototype v11 - Right Project Sidebar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ah:250;--bh:265;--k:1}
:root{
  --win:oklch(.16 .012 var(--bh) / .62);--glass:oklch(.24 .014 var(--bh) / .5);--glass2:oklch(.30 .016 var(--bh) / .55);
  --surf:oklch(.155 .009 var(--bh) / .86);--s2:oklch(.21 .011 var(--bh) / .8);--s3:oklch(.27 .013 var(--bh) / .8);--s4:oklch(.33 .015 var(--bh) / .8);
  --line:oklch(1 0 0 / calc(.07 * var(--k)));--line2:oklch(1 0 0 / calc(.13 * var(--k)));
  --spec:inset 0 1px 0 oklch(1 0 0 / .16),inset 0 -1px 0 oklch(0 0 0 / .25);
  --fg:oklch(.97 .004 var(--bh));--fg2:oklch(calc(.62 + .1 * var(--k)) .012 var(--bh));--fg3:oklch(calc(.45 + .08 * var(--k)) .014 var(--bh));
  --acc:oklch(.68 .19 var(--ah));--accs:oklch(.68 .19 var(--ah) / .16);--acct:#fff;
  --grn:oklch(.77 .16 155);--red:oklch(.68 .2 22);--yel:oklch(.83 .15 85);--blu:oklch(.72 .14 245);--pur:oklch(.71 .17 300);--pnk:oklch(.75 .16 350);--org:oklch(.75 .16 55);
  --term:oklch(.11 .008 var(--bh) / .92);--shadow:0 50px 120px -30px oklch(0 0 0 / .7);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
[data-theme=light]{
  --win:oklch(.97 .006 var(--bh) / .6);--glass:oklch(1 0 0 / .5);--glass2:oklch(1 0 0 / .62);
  --surf:oklch(.99 .003 var(--bh) / .86);--s2:oklch(.955 .006 var(--bh) / .85);--s3:oklch(.92 .008 var(--bh) / .85);--s4:oklch(.88 .01 var(--bh) / .85);
  --line:oklch(0 0 0 / calc(.07 * var(--k)));--line2:oklch(0 0 0 / calc(.12 * var(--k)));
  --spec:inset 0 1px 0 oklch(1 0 0 / .9),inset 0 -1px 0 oklch(0 0 0 / .06);
  --fg:oklch(.2 .012 var(--bh));--fg2:oklch(calc(.47 - .08 * var(--k)) .014 var(--bh));--fg3:oklch(calc(.64 - .07 * var(--k)) .014 var(--bh));
  --acc:oklch(.58 .2 var(--ah));--accs:oklch(.58 .2 var(--ah) / .12);
  --grn:oklch(.6 .16 155);--red:oklch(.58 .21 22);--yel:oklch(.68 .15 75);--blu:oklch(.58 .17 245);--pur:oklch(.56 .2 300);--pnk:oklch(.6 .19 350);
  --term:oklch(.17 .012 var(--bh) / .94);--shadow:0 50px 120px -40px oklch(0 0 0 / .4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--fg);font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.mono{font-family:"SF Mono","JetBrains Mono",ui-monospace,monospace;font-size:11.5px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--s4);border-radius:10px;border:3px solid transparent;background-clip:content-box}

/* ===== wallpaper (macOS desktop) ===== */
.wall{position:fixed;inset:-10%;z-index:-1;background:
  radial-gradient(40% 50% at 15% 20%,oklch(.55 .22 280) 0%,transparent 70%),
  radial-gradient(35% 45% at 85% 15%,oklch(.65 .2 20) 0%,transparent 70%),
  radial-gradient(45% 55% at 75% 85%,oklch(.6 .17 200) 0%,transparent 70%),
  radial-gradient(40% 50% at 20% 90%,oklch(.7 .17 60) 0%,transparent 70%),oklch(.22 .06 270);
  filter:saturate(1.15);animation:drift 30s ease-in-out infinite alternate}
[data-theme=light] .wall{filter:saturate(.9) brightness(1.35)}
@keyframes drift{to{transform:translate(3%,-2%) scale(1.06) rotate(2deg)}}

/* ===== window ===== */
.window{position:fixed;inset:22px;border-radius:24px;background:var(--win);backdrop-filter:blur(60px) saturate(1.8);-webkit-backdrop-filter:blur(60px) saturate(1.8);box-shadow:var(--shadow),inset 0 0 0 1px var(--line2);display:grid;grid-template-rows:48px 1fr auto;overflow:hidden}
.lg:not(.window){position:relative}
.lg::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(150deg,oklch(1 0 0 / .5),oklch(1 0 0 / .06) 35%,oklch(1 0 0 / .02) 65%,oklch(1 0 0 / .28));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
[data-theme=light] .lg::after{background:linear-gradient(150deg,oklch(1 0 0 / 1),oklch(1 0 0 / .3) 40%,oklch(0 0 0 / .04) 70%,oklch(1 0 0 / .7))}

/* titlebar */
.title{display:flex;align-items:center;gap:10px;padding:0 14px 0 18px}
.lights{display:flex;gap:8px;margin-right:8px}.lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px oklch(0 0 0 / .3)}
.rtabs{display:flex;gap:4px}
.rtab{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;color:var(--fg2);cursor:pointer;border:0;background:none;font-weight:500}
.rtab:hover{background:var(--glass)}
.rtab.on{background:var(--glass2);color:var(--fg);box-shadow:var(--spec)}
.rtab i{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:700;color:#fff}
.search{margin:0 auto;display:flex;align-items:center;gap:8px;width:min(420px,34vw);padding:6px 12px;border-radius:999px;background:var(--glass);box-shadow:var(--spec);color:var(--fg3);cursor:pointer;border:0}
.search:hover{background:var(--glass2)}
kbd{font:500 10.5px "SF Mono","JetBrains Mono",monospace;min-width:18px;text-align:center;padding:1px 5px;border-radius:5px;background:var(--s3);color:var(--fg2);box-shadow:inset 0 -1px 0 oklch(0 0 0 / .35),inset 0 1px 0 oklch(1 0 0 / .1),0 0 0 .5px var(--line2)}
.search kbd{margin-left:auto}
.tright{display:flex;align-items:center;gap:8px}
.avs{display:flex}.avs .av{margin-left:-6px;box-shadow:0 0 0 2px oklch(.2 .01 var(--bh))}
.ibtn{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;border:0;background:var(--glass);box-shadow:var(--spec);color:var(--fg2);cursor:pointer;position:relative}
.ibtn:hover{color:var(--fg);background:var(--glass2)}
.ibtn .n{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 3px}

/* shell */
.shell{position:relative;display:grid;grid-template-columns:236px minmax(0,1fr) 278px;gap:0;min-height:0;padding:0 8px 8px 8px}
.side{border-radius:18px;background:var(--glass);box-shadow:var(--spec);display:flex;flex-direction:column;min-height:0;overflow:hidden;margin-right:8px}
.sscroll{overflow:auto;flex:1;padding:6px 8px 10px}
.sh{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 4px;color:var(--fg3);font-size:11px;font-weight:600}
.sh button{border:0;background:none;color:var(--fg3);cursor:pointer;font-size:14px;line-height:1}
.nav{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:9px;color:var(--fg2);cursor:pointer;border:0;background:none;width:100%;text-align:left;font-weight:500}
.nav:hover{background:var(--glass2);color:var(--fg)}
.nav.on{background:var(--accs);color:var(--fg)}
.nav.on .ic{color:var(--acc)}
.nav .ic{width:18px;text-align:center;font-size:14px;color:var(--fg3)}
.nav .b{margin-left:auto;font-size:10.5px;padding:0 6px;border-radius:999px;background:var(--s3);color:var(--fg2);font-weight:600}
.nav .b.r{background:var(--red);color:#fff}
.wtn{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;cursor:pointer;position:relative}
.wtn:hover{background:var(--glass2)}
.wtn.on{background:var(--glass2);box-shadow:var(--spec)}
.wtn .ln{width:3px;align-self:stretch;border-radius:2px;background:var(--c)}
.wtn .nm{font-weight:600;font-size:12.5px}
.wtn .sb{font-size:11px;color:var(--fg3);display:flex;gap:5px;align-items:center}
.wtn .rt{margin-left:auto}
.sfoot{border-top:1px solid var(--line);padding:8px}
.ghacc{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;color:var(--fg2);font-size:12px}
.project-rail{display:flex;flex-direction:column;min-width:0;min-height:0;margin-left:8px;border-radius:18px;background:var(--glass);box-shadow:var(--spec);overflow:hidden}
.project-rail[hidden]{display:none}
.pr-head{display:flex;align-items:center;gap:8px;padding:14px 12px 10px}
.pr-head b{flex:1;font-size:12px;font-weight:650}
.pr-head .ibtn{width:26px;height:26px;font-size:13px}
.pr-search{padding:0 10px 10px}
.pr-search .in{width:100%;padding:6px 9px}
.pr-scroll{flex:1;overflow:auto;padding:0 8px 8px}
.pr-group{padding:5px 0}
.pr-group+.pr-group{border-top:1px solid var(--line)}
.pr-group-head{display:flex;align-items:center;gap:3px;padding:2px 3px}
.pr-collapse{width:18px;height:24px;border:0;border-radius:6px;background:none;color:var(--fg3);cursor:pointer}
.pr-collapse:hover{background:var(--glass2);color:var(--fg)}
.pr-group-toggle{flex:1;display:flex;align-items:center;gap:7px;min-width:0;padding:5px 4px;border:0;border-radius:7px;background:none;color:var(--fg2);text-align:left;cursor:pointer}
.pr-group-toggle:hover{background:var(--glass2);color:var(--fg)}
.pr-caret{width:11px;color:var(--fg3);font-size:10px}
.pr-group-mark{width:9px;height:9px;flex:none;border-radius:3px}
.pr-group-name{flex:1;overflow:hidden;font-size:11.5px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.pr-group-count{color:var(--fg3);font-size:10.5px;font-variant-numeric:tabular-nums}
.pr-group-menu{width:24px;height:24px;border:0;border-radius:6px;background:none;color:var(--fg3);cursor:pointer}
.pr-group-menu:hover{background:var(--glass2);color:var(--fg)}
.pr-project{display:flex;align-items:center;gap:8px;width:100%;min-width:0;padding:6px 8px 6px 22px;border:0;border-radius:8px;background:none;color:var(--fg2);text-align:left;cursor:pointer}
.pr-project:hover{background:var(--glass2);color:var(--fg)}
.pr-project.on{background:var(--accs);color:var(--fg)}
.pr-project-mark{display:grid;width:20px;height:20px;flex:none;place-items:center;border-radius:6px;color:#fff;font-size:9px;font-weight:700}
.pr-project-detail{display:flex;flex:1;flex-direction:column;min-width:0;gap:1px}
.pr-project-name,.pr-project-owner{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr-project-name{font-size:11.5px;font-weight:550}
.pr-project-owner{color:var(--fg3);font-size:10px}
.pr-prs{flex:none;padding:1px 5px;border-radius:999px;background:var(--s3);color:var(--fg3);font-size:9px}
.pr-empty{padding:8px 22px;color:var(--fg3);font-size:11px}
.pr-foot{display:flex;gap:6px;padding:9px 10px;border-top:1px solid var(--line)}
.pr-foot .btn{flex:1;justify-content:center;padding-inline:8px}
.project-context{display:flex;align-items:center;gap:7px;min-width:0;padding:5px 9px;border-radius:8px;color:var(--fg2);font-size:12px}
.project-context-mark{width:8px;height:8px;flex:none;border-radius:3px}
.project-context-group{color:var(--fg3)}
.project-context-name{overflow:hidden;color:var(--fg);font-weight:550;text-overflow:ellipsis;white-space:nowrap}
.project-context-sep{color:var(--fg3)}
.shell.projects-closed{grid-template-columns:236px minmax(0,1fr)}
.shell.projects-closed .project-rail{display:none}
@media(max-width:1120px){
  .shell{grid-template-columns:210px minmax(0,1fr)}
  .shell.projects-closed{grid-template-columns:210px minmax(0,1fr)}
  .project-rail{position:absolute;z-index:25;top:0;right:8px;bottom:8px;width:min(278px,calc(100vw - 250px));margin:0;box-shadow:var(--shadow),var(--spec),0 0 0 .5px var(--line2)}
}
@media(max-width:720px){
  .shell{grid-template-columns:52px minmax(0,1fr)}
  .shell.projects-closed{grid-template-columns:52px minmax(0,1fr)}
  .project-rail{width:min(278px,calc(100vw - 82px))}
}

/* stage */
.stage{border-radius:18px;background:var(--surf);box-shadow:var(--spec),0 0 0 .5px var(--line2);display:grid;grid-template-rows:52px 1fr;min-height:0;min-width:0;overflow:hidden}
.tool{display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line)}
.tool h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.tool .sub{color:var(--fg3);font-weight:400;font-size:12.5px}
.tool .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.grp{display:flex;border-radius:999px;background:var(--s2);box-shadow:var(--spec);padding:2px}
.grp button{border:0;background:none;padding:4px 11px;border-radius:999px;color:var(--fg2);cursor:pointer;display:flex;gap:6px;align-items:center;font-weight:500}
.grp button:hover{color:var(--fg)}
.grp button.on{background:var(--s4);color:var(--fg);box-shadow:var(--spec)}
.grp button b{color:var(--fg);font-weight:650}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:0;background:var(--s2);box-shadow:var(--spec),0 0 0 .5px var(--line2);color:var(--fg);cursor:pointer;font-weight:500;white-space:nowrap;transition:transform .2s var(--spring),background .15s}
.btn:hover{background:var(--s3)}.btn:active{transform:scale(.95)}
.btn.p{background:var(--acc);color:var(--acct);box-shadow:inset 0 1px 0 oklch(1 0 0 / .3),0 6px 18px -6px var(--acc)}
.btn.g{background:var(--grn);color:oklch(.2 .05 155)}
.btn.sm{padding:2px 9px;font-size:12px}
.btn.ghost{background:none;box-shadow:none;color:var(--fg2)}.btn.ghost:hover{background:var(--s2);color:var(--fg)}
.btn[disabled]{opacity:.4;pointer-events:none}
.view{min-height:0;overflow:hidden;position:relative}
.stagew{display:grid;min-height:0;min-width:0;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);position:relative}
.stagew.split-h{grid-template-columns:minmax(0,calc((100% - 8px) * var(--r))) 8px minmax(0,1fr)}
.stagew.split-v{grid-template-rows:minmax(0,calc((100% - 8px) * var(--r))) 8px minmax(0,1fr)}
.sdiv{cursor:col-resize;position:relative}.split-v .sdiv{cursor:row-resize}
.sdiv::after{content:"";position:absolute;inset:0;margin:auto;width:3px;height:44px;border-radius:2px;background:var(--line2);transition:.2s var(--spring)}
.split-v .sdiv::after{width:44px;height:3px}
.sdiv:hover::after,.resizing .sdiv::after{background:var(--acc);height:90px}.split-v .sdiv:hover::after,.split-v.resizing .sdiv::after{width:90px;height:3px}
.stagew.resizing{user-select:none}
.stage{container-type:inline-size}
@container (max-width:780px){.stage .agrid{grid-template-columns:minmax(0,1fr)}.stage .pane.l-left,.stage .pane.l-right{grid-column:1}.stage .tool .sub{display:none}.stage .scm{grid-template-columns:250px minmax(0,1fr)}.stage .gwrap{grid-template-columns:1fr 260px}.stage .fw{grid-template-columns:210px minmax(0,1fr)}.stage .lay{display:none}}
@container (max-width:560px){.stage .tool .grp{display:none}}
.stage.focus{box-shadow:var(--spec),0 0 0 1.5px color-mix(in oklch,var(--acc) 70%,transparent),0 10px 40px -20px var(--acc)}
.pctl{display:flex;gap:2px;margin-left:auto;padding-left:8px}.acts~.pctl{margin-left:8px;border-left:1px solid var(--line)}
.nav.on2{background:var(--s2);color:var(--fg)}
.nav .spl{margin-left:auto;font-size:11px;color:var(--acc)}.nav .spl+.b{margin-left:6px}
.dropz{position:absolute;inset:0;z-index:30;pointer-events:none;animation:fade .15s;border-radius:18px;background:oklch(0 0 0 / .18);backdrop-filter:blur(3px)}
.dropz .hl{position:absolute;border-radius:16px;border:2px dashed var(--acc);background:var(--accs);color:var(--acc);display:grid;place-items:center;font-weight:650;font-size:15px;transition:all .25s var(--spring);inset:6px 50% 6px 6px}
.dropz[data-side=right] .hl{inset:6px 6px 6px 50%}.dropz[data-side=top] .hl{inset:6px 6px 50% 6px}.dropz[data-side=bottom] .hl{inset:50% 6px 6px 6px}
.dropz .dzh{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:11.5px;color:var(--fg2);background:var(--glass2);padding:3px 10px;border-radius:999px}
.sdirs{display:flex;gap:2px;margin-left:8px}.sdirs i{font-style:normal;width:22px;height:20px;border-radius:5px;display:grid;place-items:center;opacity:.65}.sdirs i:hover{opacity:1;background:oklch(1 0 0 / .25)}
.vin{height:100%;animation:vin .35s var(--spring)}
@keyframes vin{from{opacity:0;transform:translateY(8px) scale(.995)}}

/* atoms */
.av{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff;flex:none;background:var(--c)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--s3);color:var(--fg2);white-space:nowrap}
.cg{background:color-mix(in oklch,var(--grn) 16%,transparent);color:var(--grn)}.cr{background:color-mix(in oklch,var(--red) 16%,transparent);color:var(--red)}
.cy{background:color-mix(in oklch,var(--yel) 18%,transparent);color:var(--yel)}.ca{background:var(--accs);color:var(--acc)}.cp{background:color-mix(in oklch,var(--pur) 18%,transparent);color:var(--pur)}
.g{color:var(--grn)}.r{color:var(--red)}.y{color:var(--yel)}.a{color:var(--acc)}.m{color:var(--fg3)}.p2{color:var(--pur)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none;background:var(--c)}
.pulse{animation:pl 1.5s ease-in-out infinite}@keyframes pl{50%{opacity:.3}}
.spin{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid color-mix(in oklch,var(--yel) 30%,transparent);border-top-color:var(--yel);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.card{background:var(--s2);border-radius:14px;box-shadow:var(--spec),0 0 0 .5px var(--line);overflow:hidden}
.ch{display:flex;align-items:center;gap:8px;padding:11px 14px;font-weight:600;border-bottom:1px solid var(--line)}
.ch .m{font-weight:400}.ch .rt{margin-left:auto;display:flex;gap:6px}
.row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);transition:background .15s}
.row:last-child{border-bottom:0}.row:hover{background:var(--s3)}
.row .tt{font-weight:550}.row .sb{font-size:11.5px;color:var(--fg3)}.row .rt{margin-left:auto;display:flex;gap:6px;align-items:center}
.st{width:16px;height:16px;border-radius:4px;display:inline-grid;place-items:center;font:700 9.5px "JetBrains Mono";flex:none}
.sM{background:color-mix(in oklch,var(--yel) 18%,transparent);color:var(--yel)}.sA{background:color-mix(in oklch,var(--grn) 18%,transparent);color:var(--grn)}.sD{background:color-mix(in oklch,var(--red) 18%,transparent);color:var(--red)}.sC{background:var(--red);color:#fff}
.tabs{display:flex;gap:18px;padding:0 16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 0;color:var(--fg3);font-weight:550;cursor:pointer}
.tabs button.on{color:var(--fg);box-shadow:inset 0 -2px var(--acc)}
.empty{display:grid;place-items:center;height:100%;color:var(--fg3)}
input.in,textarea.in,select.in{width:100%;background:var(--s2);border:0;box-shadow:inset 0 0 0 1px var(--line2);border-radius:10px;padding:8px 10px;color:var(--fg);font:inherit;outline:none}
input.in:focus,textarea.in:focus{box-shadow:inset 0 0 0 1.5px var(--acc),0 0 0 4px var(--accs)}
.split2{display:grid;height:100%;min-height:0}
.scroll{overflow:auto;min-height:0}
.diff{font:11.5px/1.75 "SF Mono","JetBrains Mono",monospace}
.dl{display:grid;grid-template-columns:40px 1fr;white-space:pre}
.dl i{font-style:normal;color:var(--fg3);text-align:right;padding-right:10px;opacity:.6;user-select:none}
.dl.a{background:color-mix(in oklch,var(--grn) 12%,transparent)}.dl.d{background:color-mix(in oklch,var(--red) 12%,transparent)}
.dl.h{background:var(--s2);color:var(--fg3)}

/* ===== graph ===== */
.gwrap{display:grid;grid-template-columns:1fr 330px;height:100%;min-height:0}
.gl{position:relative;overflow:auto;border-right:1px solid var(--line)}
.gf{display:flex;gap:6px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surf);z-index:5;backdrop-filter:blur(20px)}
.gf .chip{cursor:pointer;padding:3px 10px;font-size:11.5px}
.gbody{position:relative}
.grow{display:grid;grid-template-columns:132px minmax(0,1fr) 110px 48px 70px;align-items:center;height:36px;padding-right:14px;cursor:default;position:relative;z-index:2;transition:background .12s}
.grow:hover{background:var(--s2)}
.grow.sel{background:var(--accs)}
.grow.sel::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.grow.dim{opacity:.3}
.gm{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;min-width:0}
.gm .tx{overflow:hidden;text-overflow:ellipsis}
.ref{font-size:10.5px;font-weight:650;line-height:18px;padding:0 7px;border-radius:6px;background:color-mix(in oklch,var(--c) 18%,transparent);color:var(--c);display:inline-flex;gap:4px;align-items:center;flex:none}
.ref.wt{box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--c) 45%,transparent)}
.who{display:flex;align-items:center;gap:6px;color:var(--fg2);font-size:12px}
svg.lanes{position:absolute;left:0;top:0;z-index:3;pointer-events:none;overflow:visible}
.edge{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-out forwards}
.edge.wip{stroke-dasharray:.03 .03;stroke-dashoffset:0;animation:none}
@keyframes draw{to{stroke-dashoffset:0}}
.node{animation:pop .4s var(--spring) backwards}
@keyframes pop{from{transform:scale(0)}}
.insp{display:flex;flex-direction:column;min-height:0;overflow:auto}
.insp .hd{padding:16px}
.insp h2{margin:6px 0 10px;font-size:16px;font-weight:650;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.fl{display:flex;align-items:center;gap:8px;padding:6px 16px;font-size:12.5px;cursor:pointer}
.fl:hover{background:var(--s2)}
.fl .n{margin-left:auto;font:11px "JetBrains Mono";color:var(--fg3)}
.bars{display:flex;gap:1px;margin-left:6px}.bars i{width:5px;height:8px;border-radius:1px;background:var(--s4)}
.ai{margin:0 16px 14px;padding:12px;border-radius:12px;background:linear-gradient(135deg,color-mix(in oklch,var(--pur) 16%,transparent),color-mix(in oklch,var(--acc) 10%,transparent));box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--pur) 35%,transparent);font-size:12.5px;color:var(--fg2)}
.ai b{color:var(--fg)}
.composer{margin:auto 12px 12px;padding:12px;border-radius:14px;background:var(--s2);box-shadow:var(--spec),0 0 0 .5px var(--line2)}
.stagel .row{padding:6px 12px}
.cb{width:15px;height:15px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--fg3);flex:none;cursor:pointer;display:grid;place-items:center;font-size:10px;color:#fff;transition:.15s}
.cb.on{background:var(--acc);box-shadow:none}.cb.on::after{content:"✓"}

/* ===== context menu / palette / toast ===== */
.menu{position:fixed;z-index:100;min-width:230px;padding:5px;border-radius:14px;background:var(--glass2);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);box-shadow:0 20px 50px -10px oklch(0 0 0 / .5),var(--spec),0 0 0 .5px var(--line2);animation:pop2 .25s var(--spring);transform-origin:top left}
@keyframes pop2{from{opacity:0;transform:scale(.92)}}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:6px 10px;border-radius:8px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--acc);color:#fff}.menu button:hover kbd{background:oklch(1 0 0 / .2);color:#fff}
.menu button kbd{margin-left:auto}
.menu hr{border:0;border-top:1px solid var(--line2);margin:4px 6px}
.scrim{position:fixed;inset:0;z-index:90;background:oklch(0 0 0 / .25);backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.pal{position:fixed;z-index:95;left:50%;top:14vh;transform:translateX(-50%);width:min(640px,90vw);border-radius:20px;background:var(--glass2);backdrop-filter:blur(50px) saturate(1.8);-webkit-backdrop-filter:blur(50px) saturate(1.8);box-shadow:0 40px 100px -20px oklch(0 0 0 / .6),var(--spec),0 0 0 .5px var(--line2);overflow:hidden;animation:palin .3s var(--spring)}
@keyframes palin{from{opacity:0;transform:translateX(-50%) scale(.95) translateY(-10px)}}
.pal input{width:100%;border:0;background:none;padding:18px 20px;font-size:17px;color:var(--fg);outline:none;border-bottom:1px solid var(--line2)}
.pal .list{max-height:52vh;overflow:auto;padding:6px}
.pal .grp-t{padding:8px 12px 4px;font-size:11px;color:var(--fg3);font-weight:600}
.pi{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;cursor:pointer}
.pi .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--s3);font-size:13px}
.pi .hint{color:var(--fg3);font-size:12px}
.pi kbd{margin-left:auto}
.pi.on{background:var(--acc);color:#fff}.pi.on .hint{color:oklch(1 0 0 / .75)}.pi.on .ic{background:oklch(1 0 0 / .2)}
.pal .ft{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line2);color:var(--fg3);font-size:11.5px}
.toasts{position:fixed;right:40px;bottom:40px;z-index:120;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:14px;background:var(--glass2);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);box-shadow:0 20px 50px -10px oklch(0 0 0 / .5),var(--spec),0 0 0 .5px var(--line2);animation:tin .45s var(--spring);min-width:300px}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateY(20px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
.toast .ti{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accs);color:var(--acc)}
.toast .tb{flex:1}.toast .tb small{display:block;color:var(--fg3)}

/* ===== CLI panes (agents & shells share one renderer) ===== */
.agrid{display:grid;grid-auto-flow:row dense;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(310px,1fr);gap:10px;padding:10px;height:100%;overflow:auto}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;border-radius:14px;background:var(--term);box-shadow:var(--spec),0 0 0 .5px var(--line2);overflow:hidden;color:oklch(.9 .005 var(--bh));transition:box-shadow .2s}
.pane.st-waiting{box-shadow:0 0 0 1.5px color-mix(in oklch,var(--yel) 70%,transparent),0 0 30px -12px var(--yel)}
.pane.focus{box-shadow:0 0 0 1.5px var(--acc)}
.pane.l-full{grid-column:1/-1}.pane.l-left{grid-column:1}.pane.l-right{grid-column:2}
.lay{display:flex;gap:1px;background:oklch(1 0 0 / .06);border-radius:7px;padding:1px}.lay button{border:0;background:none;color:oklch(.6 .01 var(--bh));width:24px;height:20px;border-radius:6px;cursor:pointer;font-size:12px}.lay button:hover{color:#fff}.lay button.on{background:oklch(1 0 0 / .16);color:#fff}
.phd{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid oklch(1 0 0 / .07);font-size:12px;background:oklch(1 0 0 / .03)}
.phd .sp,.thd .sp{flex:1}.phd>*{flex-shrink:0}.phd .sp{flex-shrink:1;min-width:0}
.asel{background:oklch(1 0 0 / .08);border:0;color:inherit;border-radius:7px;padding:2px 6px;font:500 12px Inter,sans-serif;outline:none;cursor:pointer}
.asel option{background:#1d1d22;color:#eee}
.phb{border:0;background:oklch(1 0 0 / .07);color:oklch(.88 0 0);border-radius:7px;padding:3px 8px;font-size:11.5px;cursor:pointer;white-space:nowrap}
.phb:hover{background:oklch(1 0 0 / .14)}.phb.x:hover{background:color-mix(in oklch,var(--red) 70%,transparent);color:#fff}
.pbody{flex:1;overflow:auto;padding:10px 14px;font:12px/1.65 "SF Mono","JetBrains Mono",monospace}
.pbody .ln{margin:2px 0 6px;white-space:pre-wrap;word-break:break-word}
.dim{color:oklch(.6 .01 var(--bh))}
.uline{background:oklch(1 0 0 / .06);padding:4px 8px;border-radius:6px;color:oklch(.96 0 0)}
.cbox{border:1px solid oklch(.72 .13 45 / .6);border-radius:8px;padding:6px 12px;margin-bottom:8px;display:inline-block;min-width:60%}
.choice{white-space:pre-wrap;border:1px solid color-mix(in oklch,var(--yel) 50%,transparent);border-radius:8px;padding:8px 12px;margin:6px 0}
.choice .copt.on{color:var(--yel)}
.wtn>div:nth-child(2){flex:1;min-width:0}.wtn .nm,.wtn .sb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wtn .sb{display:block}
.pin{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid oklch(1 0 0 / .07);font:12px "SF Mono","JetBrains Mono",monospace}
.pin input{flex:1;border:0;background:none;outline:none;color:inherit;font:inherit}
.spinc{display:inline-block;animation:sp 1.4s linear infinite}
.pg{color:var(--grn)}
/* ===== terminal dock: bottom / right / floating / max, opened from anywhere ===== */
.term{position:fixed;z-index:60;display:none;flex-direction:column;border-radius:16px;background:var(--term);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);box-shadow:0 30px 80px -20px oklch(0 0 0 / .6),var(--spec),0 0 0 .5px var(--line2);overflow:hidden;color:oklch(.9 .005 var(--bh));transition:left .4s var(--spring),top .4s var(--spring),width .4s var(--spring),height .4s var(--spring)}
.term.on{display:flex}
.term.dragging{transition:none}
.term.m-float{resize:both;min-width:380px;min-height:220px}
.term.m-float .thd{cursor:move}
.thd{display:flex;align-items:center;gap:3px;padding:5px 8px;border-bottom:1px solid oklch(1 0 0 / .07);user-select:none;overflow:hidden}
.ttab{display:flex;align-items:center;gap:6px;border:0;background:none;color:oklch(.62 .01 var(--bh));padding:4px 8px 4px 10px;border-radius:7px;font-size:12px;cursor:pointer;white-space:nowrap}
.ttab.on{background:oklch(1 0 0 / .1);color:oklch(.97 0 0)}
.ttab .x{opacity:0;margin-left:2px}.ttab:hover .x{opacity:.7}
.tdk{display:flex;gap:2px}.tdk button{border:0;background:none;color:oklch(.62 .01 var(--bh));width:26px;height:24px;border-radius:6px;cursor:pointer}
.tdk button:hover{background:oklch(1 0 0 / .09);color:#fff}.tdk button.on{background:oklch(1 0 0 / .14);color:#fff}
.tbody{flex:1;display:grid;min-height:0}.tbody.sp2{grid-template-columns:1fr 1fr}
#term .pane{border-radius:0;background:none;box-shadow:none}
#term .pane+.pane{border-left:1px solid oklch(1 0 0 / .08)}
.shell{transition:padding .4s var(--spring)}
body.tb-bottom .shell{padding-bottom:306px}body.tb-right .shell{padding-right:496px}
.wtn .tbtn{display:none;width:24px;height:22px;border-radius:6px;border:0;background:var(--s3);color:var(--fg2);cursor:pointer;font-size:10px;place-items:center;margin-left:auto}
.wtn:hover .tbtn{display:grid}.wtn:hover .rt{display:none}
/* ===== modal (handover / new agent / race) ===== */
.obc.dlg{width:min(420px,92vw);padding:24px;text-align:left}
.dlg-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px;background:var(--accs);color:var(--acc);margin-bottom:14px;box-shadow:var(--spec)}
.dlg-ic.d{background:color-mix(in oklch,var(--red) 18%,transparent);color:var(--red)}
.obc.dlg h3{margin:0 0 6px;font-size:16px;font-weight:650;letter-spacing:-.01em}
.obc.dlg p{margin:0;color:var(--fg2);font-size:13px;line-height:1.55}
.obc.dlg .in{margin-top:14px}
.dlg-meta{margin-top:12px;padding:8px 10px;border-radius:10px;background:var(--s2);font:11.5px "JetBrains Mono",monospace;color:var(--fg2)}
.dlg-b{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.btn.danger{background:var(--red);color:#fff;box-shadow:inset 0 1px 0 oklch(1 0 0 / .25),0 6px 18px -6px var(--red)}
.obc.mdl{text-align:left;width:min(640px,92vw);max-height:88vh;overflow:auto}
.apick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.apick label{padding:10px;border-radius:12px;background:var(--s2);box-shadow:var(--spec),0 0 0 .5px var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;font-weight:600;font-size:12.5px;transition:box-shadow .15s}
.apick input{display:none}
.apick label:has(input:checked){box-shadow:0 0 0 2px var(--acc),0 0 0 6px var(--accs)}
.apick label:has(input:disabled){opacity:.35;cursor:not-allowed}
.where{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.where label{padding:10px 12px;border-radius:12px;background:var(--s2);box-shadow:var(--spec),0 0 0 .5px var(--line);cursor:pointer;font-size:12.5px}
.where label b{display:block}.where label small{color:var(--fg3)}
.where input{display:none}.where label:has(input:checked){box-shadow:0 0 0 2px var(--acc)}
.cmdpv{margin-top:12px;padding:9px 12px;border-radius:10px;background:var(--term);color:oklch(.9 0 0);font:12px "SF Mono","JetBrains Mono",monospace}
.chk{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--fg2)}.chk label{display:flex;gap:6px;align-items:center}
/* ===== GitHub-style repository ===== */
.gh{height:100%;overflow:auto}
.ghh{padding:16px 24px 0;border-bottom:1px solid var(--line)}
.ghn{display:flex;align-items:center;gap:8px;font-size:18px}
.ghn a{color:var(--acc);text-decoration:none}.ghn b{font-weight:650}
.ghn .acts{margin-left:auto;display:flex;gap:6px}
.ghbtn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:7px;background:var(--s2);box-shadow:0 0 0 1px var(--line2);font-size:12px;font-weight:550;cursor:pointer;border:0;color:var(--fg)}
.ghbtn .cnt{padding:0 6px;border-radius:999px;background:var(--s4);font-size:11px}
.ghbtn.green{background:oklch(.55 .15 150);color:#fff;box-shadow:inset 0 0 0 1px oklch(1 0 0 / .15)}
.ghtabs{display:flex;gap:2px;margin-top:14px;overflow:auto}
.ghtabs button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:8px 12px 10px;color:var(--fg2);cursor:pointer;font-size:13px;border-radius:6px 6px 0 0;position:relative;white-space:nowrap}
.ghtabs button:hover{color:var(--fg)}
.ghtabs button.on{color:var(--fg);font-weight:600}
.ghtabs button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--org)}
.ghtabs .cnt{padding:0 6px;border-radius:999px;background:var(--s3);font-size:11px;font-weight:500}
.ghb{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:24px;padding:20px 24px}
.ghbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.ghbox{border-radius:10px;box-shadow:0 0 0 1px var(--line2);overflow:hidden;background:var(--s2)}
.ghbox .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--s3);font-size:12.5px;border-bottom:1px solid var(--line2)}
.ghrow{display:grid;grid-template-columns:22px minmax(140px,240px) minmax(0,1fr) 90px;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);font-size:13px}
.ghrow:first-of-type{border-top:0}.ghrow:hover{background:var(--s3)}
.ghrow .nm{color:var(--fg);cursor:pointer}.ghrow .nm:hover{color:var(--acc);text-decoration:underline}
.ghrow .cm{color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ghrow .tm{color:var(--fg3);text-align:right;font-size:12px}
.ghmd{padding:20px 28px;font-size:14px;line-height:1.6;color:var(--fg2)}
.ghmd h1{font-size:26px;color:var(--fg);margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line2)}
.ghmd h2{font-size:18px;color:var(--fg);margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.ghmd code{font:12px "JetBrains Mono";background:var(--s4);padding:2px 6px;border-radius:5px;color:var(--fg)}
.ghmd pre{background:var(--s3);padding:12px 14px;border-radius:8px;font:12px/1.6 "JetBrains Mono";color:var(--fg);overflow:auto}
.ghmd .bdg{display:inline-flex;font:600 10.5px Inter;border-radius:4px;overflow:hidden;margin-right:4px}.ghmd .bdg span{padding:2px 6px;background:#555;color:#fff}.ghmd .bdg span+span{background:var(--c)}
.ghs h3{font-size:15px;margin:0 0 10px;color:var(--fg)}
.ghs p{color:var(--fg2);margin:0 0 10px;font-size:13.5px}
.ghs .sec{padding:0 0 18px;margin-bottom:18px;border-bottom:1px solid var(--line2)}
.ghs .ln2{display:flex;gap:8px;align-items:center;color:var(--fg2);font-size:13px;padding:3px 0}
.topic{display:inline-block;font-size:11.5px;font-weight:550;padding:2px 10px;border-radius:999px;background:var(--accs);color:var(--acc);margin:0 4px 6px 0}
.langbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 10px}.langbar i{display:block}
.isrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;padding:10px 16px;border-top:1px solid var(--line);align-items:start}
.isrow:hover{background:var(--s3)}
.isrow .t{font-weight:600;font-size:14px;color:var(--fg)}.isrow .t:hover{color:var(--acc);cursor:pointer}
.isrow .s{font-size:12px;color:var(--fg3);margin-top:3px}
.isrow .rt{display:flex;gap:10px;align-items:center;color:var(--fg3);font-size:12px}
.ghlbl{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;margin-left:4px;background:color-mix(in oklch,var(--c) 20%,transparent);color:var(--c);box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--c) 40%,transparent)}
.flt{display:flex;gap:16px;font-size:13px;color:var(--fg3)}.flt b{color:var(--fg)}
/* ===== account switcher ===== */
.acct{display:inline-flex;align-items:center;gap:6px;border:0;background:oklch(1 0 0 / .08);color:oklch(.9 0 0);border-radius:7px;padding:2px 8px;font:500 11.5px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.acct:hover{background:oklch(1 0 0 / .15)}
.ubar{display:inline-block;width:34px;height:4px;border-radius:2px;background:oklch(.6 0 0 / .3);overflow:hidden}.ubar i{display:block;height:100%;background:var(--c);border-radius:2px}
/* ===== files & editor ===== */
.fw{display:grid;grid-template-columns:260px minmax(0,1fr);height:100%}
.fside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ftop{padding:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
#ftree{flex:1;overflow:auto;padding:2px 6px 10px}
.fside .tn{gap:7px;padding-top:3px;padding-bottom:3px}
.fst{margin-left:auto;font:700 10px "JetBrains Mono",monospace}
.dd{width:7px;height:7px;border-radius:50%;background:var(--fg2);margin-left:auto;flex:none}
.fic{font:700 8.5px "JetBrains Mono",monospace;padding:1px 3px;border-radius:3px;background:color-mix(in oklch,var(--c) 22%,transparent);color:var(--c);min-width:22px;text-align:center;flex:none}
.edp{display:flex;flex-direction:column;min-height:0;min-width:0}
.etabs{display:flex;border-bottom:1px solid var(--line);overflow:auto;background:var(--s2);min-height:36px}
.etab{display:flex;align-items:center;gap:7px;padding:8px 12px;border:0;border-right:1px solid var(--line);background:none;color:var(--fg2);cursor:pointer;font-size:12.5px;white-space:nowrap}
.etab.on{background:var(--surf);color:var(--fg);box-shadow:inset 0 2px var(--acc)}
.etab .x{opacity:.45;width:14px;text-align:center}.etab .x:hover{opacity:1}.etab .dd{margin-left:4px}
.ebar{display:flex;align-items:center;gap:8px;padding:5px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--fg3)}
.ebar .crumb b{color:var(--fg);font-weight:600}
#ed{flex:1;min-height:0;overflow:hidden}
.estat{display:flex;gap:16px;padding:4px 12px;border-top:1px solid var(--line);font:11px "JetBrains Mono",monospace;color:var(--fg3);white-space:nowrap;overflow:hidden}
.fallback{width:100%;height:100%;background:none;border:0;color:var(--fg);font:12.5px/1.7 monospace;padding:10px;resize:none;outline:none}
.cm-s-bw.CodeMirror{height:100%;background:transparent!important;color:var(--fg);font:12.5px/1.75 "SF Mono","JetBrains Mono",monospace}

.cm-s-bw .cm-keyword{color:var(--pur)}.cm-s-bw .cm-def{color:var(--blu)}.cm-s-bw .cm-variable{color:var(--fg)}.cm-s-bw .cm-variable-2,.cm-s-bw .cm-variable-3,.cm-s-bw .cm-type{color:var(--yel)}
.cm-s-bw .cm-property{color:oklch(.78 .1 210)}.cm-s-bw .cm-string,.cm-s-bw .cm-string-2{color:var(--grn)}.cm-s-bw .cm-number,.cm-s-bw .cm-atom{color:var(--org)}
.cm-s-bw .cm-comment{color:var(--fg3);font-style:italic}.cm-s-bw .cm-operator,.cm-s-bw .cm-punctuation{color:var(--fg2)}
.cm-s-bw .cm-header{color:var(--fg);font-weight:700}.cm-s-bw .cm-tag{color:var(--pnk)}.cm-s-bw .cm-attribute{color:var(--yel)}.cm-s-bw .cm-link{color:var(--acc)}
.cm-s-bw .CodeMirror-matchingbracket{color:var(--fg)!important;background:var(--accs)}
.CodeMirror-gutter.git{width:8px}
.gm{width:3px;height:21px;margin-left:3px;border-radius:2px}
.gm-a{background:var(--grn)}.gm-m{background:var(--blu)}.gm-d{background:linear-gradient(var(--red),var(--red)) top/100% 4px no-repeat}
/* ===== project groups ===== */
.gchip{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:999px;border:0;background:var(--glass2);box-shadow:var(--spec);color:var(--fg);font-weight:600;cursor:pointer;white-space:nowrap}

.tsep{width:1px;height:18px;background:var(--line2);margin:0 4px}
.ppop{position:fixed;z-index:95;left:110px;top:66px;width:480px;max-height:72vh;display:flex;flex-direction:column;border-radius:18px;background:var(--glass2);backdrop-filter:blur(50px) saturate(1.8);-webkit-backdrop-filter:blur(50px) saturate(1.8);box-shadow:0 30px 80px -20px oklch(0 0 0 / .6),var(--spec),0 0 0 .5px var(--line2);animation:pop2 .25s var(--spring);transform-origin:top left;overflow:hidden}
.phd2{padding:10px;border-bottom:1px solid var(--line2)}
.ppop .pl{overflow:auto;padding:6px}
.pg-sec{border-radius:12px;padding:4px;margin-bottom:4px;transition:background .15s,box-shadow .15s}
.pg-sec.cur{background:oklch(1 0 0 / .03)}
.pg-sec.over{background:var(--accs);box-shadow:inset 0 0 0 1.5px var(--acc)}
.pg-h{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:12.5px}
.pg-h .sq{width:10px;height:10px;border-radius:3px;flex:none}
.pg-h button{border:0;background:none;color:var(--fg3);cursor:pointer;border-radius:6px;padding:1px 7px;font-size:11.5px}.pg-h button:hover{background:var(--s3);color:var(--fg)}
.pg-r{display:flex;align-items:center;gap:9px;padding:6px 8px 6px 14px;border-radius:9px;cursor:pointer;font-size:12.5px}
.pg-r:hover{background:var(--s3)}.pg-r.on{background:var(--accs)}.pg-r.drag{opacity:.4}
.pg-r i{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:700;color:#fff;flex:none}
.pg-r .mono{margin-left:auto;font-size:10.5px}
.ppop .pf{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line2)}
.gsw{display:flex;gap:8px}.gsw input{display:none}.gsw i{display:block;width:24px;height:24px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 2px oklch(1 0 0 / .25)}
.gsw label:has(input:checked) i{box-shadow:0 0 0 2px var(--surf),0 0 0 4px var(--fg)}
/* ===== changes / source control ===== */
.scm{display:grid;grid-template-columns:320px minmax(0,1fr);height:100%}
.scml{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.scmh{display:flex;align-items:center;gap:2px;padding:8px 10px 4px 14px}
.scmb{padding:6px 10px 10px;border-bottom:1px solid var(--line)}
.cbox2{position:relative}.cbox2 textarea{resize:vertical;font-size:12.5px;padding-right:34px;min-height:64px}
.aig{position:absolute;top:6px;right:6px;color:var(--pur)!important}
.splitb{display:flex}.splitb .btn:first-child{flex:1;justify-content:center;border-radius:999px 0 0 999px}.splitb .btn:last-child{border-radius:0 999px 999px 0;padding:5px 10px;margin-left:1px}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.scs-h{display:flex;align-items:center;gap:6px;padding:7px 12px 5px;font-size:11px;font-weight:650;color:var(--fg2);cursor:pointer;user-select:none;text-transform:uppercase;letter-spacing:.02em}
.scs-h .ha{display:none;margin-left:auto;gap:1px}.scs-h:hover .ha{display:flex}
.scf{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 22px;font-size:12.5px;cursor:pointer;min-width:0}
.scf:hover{background:var(--s2)}.scf.on{background:var(--accs)}
.scf .dir{color:var(--fg3);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.scf .sl{margin-left:auto;font:700 11px "JetBrains Mono",monospace;width:14px;text-align:center;flex:none}
.scf .ha{display:none;gap:1px;margin-left:auto;flex:none}.scf:hover .ha{display:flex}.scf:hover .ha+.sl{margin-left:4px}
.ib2{width:22px;height:20px;border:0;background:none;border-radius:5px;color:var(--fg2);cursor:pointer;display:inline-grid;place-items:center;font-size:12px;flex:none}
.ib2:hover{background:var(--s4);color:var(--fg)}
.dv{display:flex;flex-direction:column;min-width:0;min-height:0}
.dvh{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap;overflow:hidden}
.dcols{display:grid;grid-template-columns:1fr 1fr;font-size:11px;color:var(--fg3);border-bottom:1px solid var(--line)}.dcols span{padding:3px 12px}.dcols span+span{border-left:1px solid var(--line)}
.dvwrap{flex:1;min-height:0;display:flex}
.dvb{flex:1;overflow:auto;font:12px/20px "SF Mono","JetBrains Mono",monospace;min-width:0}
.dr{display:grid;grid-template-columns:44px minmax(0,1fr) 44px minmax(0,1fr);min-height:20px}
.dr.inl{grid-template-columns:40px 40px minmax(0,1fr)}
.dr .n{color:var(--fg3);text-align:right;padding-right:8px;user-select:none;opacity:.7;cursor:pointer}
.dr .c{white-space:pre;padding-left:8px;overflow:hidden;text-overflow:ellipsis}
.dr:not(.inl) .c:nth-child(2){border-right:1px solid var(--line)}
.c.del{background:color-mix(in oklch,var(--red) 13%,transparent)}.c.add{background:color-mix(in oklch,var(--grn) 12%,transparent)}
.c.emp{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--s2) 6px 7px)}
mark.md{background:color-mix(in oklch,var(--red) 38%,transparent);color:inherit;border-radius:2px}mark.ma{background:color-mix(in oklch,var(--grn) 36%,transparent);color:inherit;border-radius:2px}
.dr.sel .n{background:var(--accs);color:var(--acc);opacity:1}.dr.sel .c{box-shadow:inset 0 0 0 100px color-mix(in oklch,var(--acc) 8%,transparent)}
.off{opacity:.32}
.hk2{display:flex;align-items:center;gap:8px;padding:3px 10px;background:var(--s2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--fg3);font-family:Inter,sans-serif;font-size:11.5px;min-height:28px}

.fold{padding:2px 0;text-align:center;color:var(--acc);background:color-mix(in oklch,var(--acc) 6%,transparent);cursor:pointer;font-family:Inter,sans-serif;font-size:11.5px}
.fold:hover{background:var(--accs)}
.ruler{width:12px;border-left:1px solid var(--line);position:relative;flex:none}.ruler i{position:absolute;left:3px;right:3px;height:3px;border-radius:1px}
/* ===== launchpad ===== */
.lp{padding:20px;display:grid;grid-template-columns:1.3fr 1fr 1fr;grid-auto-rows:min-content;gap:14px;overflow:auto;height:100%}
.hero{grid-column:1/-1;display:flex;align-items:flex-end;gap:20px}
.hero h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.025em}
.hero p{margin:4px 0 0;color:var(--fg2)}
.kpis{margin-left:auto;display:flex;gap:10px}
.kpi{padding:10px 16px;border-radius:14px;background:var(--s2);box-shadow:var(--spec),0 0 0 .5px var(--line);min-width:118px}
.kpi b{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em}.kpi span{color:var(--fg3);font-size:11.5px}
.spark{display:block;margin-top:4px}
.agc{margin:10px;padding:12px;border-radius:12px;background:var(--s3);box-shadow:var(--spec)}
.agc.wait{box-shadow:var(--spec),0 0 0 1px color-mix(in oklch,var(--yel) 50%,transparent)}
.agc .t{display:flex;align-items:center;gap:8px;font-weight:600}.agc .t .chip{margin-left:auto}
.agc .s{color:var(--fg3);font-size:11.5px;margin:3px 0 8px}
.prog{height:4px;border-radius:2px;background:var(--s4);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--pur));border-radius:2px;transition:width .6s}
.ask{margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--s2);font-size:12px;color:var(--fg2);border-left:2px solid var(--yel)}

/* ===== agents ===== */
.ag{display:grid;grid-template-columns:280px 1fr 300px;height:100%}
.ags{border-right:1px solid var(--line);overflow:auto}
.agi{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.agi:hover{background:var(--s2)}.agi.on{background:var(--accs)}
.agi .t{display:flex;align-items:center;gap:8px;font-weight:600}.agi .t .chip{margin-left:auto}
.agi .s{color:var(--fg3);font-size:11.5px;margin-top:3px}
.tr{display:flex;flex-direction:column;min-height:0}
.trl{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.ev{animation:vin .4s var(--spring)}
.ev.u{align-self:flex-end;max-width:70%;background:var(--acc);color:#fff;padding:8px 12px;border-radius:14px 14px 4px 14px}
.ev.a{max-width:85%;color:var(--fg)}
.ev.tool{border-radius:10px;background:var(--s2);box-shadow:0 0 0 .5px var(--line2);font:11.5px/1.6 "JetBrains Mono";overflow:hidden;max-width:85%}
.ev.tool .h{display:flex;gap:8px;padding:5px 10px;background:var(--s3);font-family:inherit}
.ev.tool .h .mt{margin-left:auto;color:var(--fg3)}
.ev.tool pre{margin:0;padding:6px 10px;font:inherit;white-space:pre-wrap;color:var(--fg2)}
.typing{display:flex;gap:4px;padding:6px 0}.typing i{width:6px;height:6px;border-radius:50%;background:var(--fg3);animation:pl 1s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.rep{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.agr{border-left:1px solid var(--line);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.agr h4,.h4{margin:0 0 6px;font-size:11px;color:var(--fg3);font-weight:600;letter-spacing:.02em}

/* ===== PR ===== */
.prw{display:grid;grid-template-columns:300px 1fr 270px;height:100%}
.prl{border-right:1px solid var(--line);overflow:auto}
.pri{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.pri:hover{background:var(--s2)}.pri.on{background:var(--accs)}
.pri .t{font-weight:600}.pri .s{display:flex;gap:6px;align-items:center;margin-top:4px;color:var(--fg3);font-size:11.5px}
.prm{display:flex;flex-direction:column;min-height:0}
.prh{padding:16px 18px 12px}
.prh h2{margin:0 0 8px;font-size:18px;font-weight:650;letter-spacing:-.015em}
.dbox{margin:14px 18px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 .5px var(--line2),var(--spec);background:var(--s2)}
.dbox .fh{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:550;font-size:12px}
.sbs{display:grid;grid-template-columns:1fr 1fr}.sbs>div{min-width:0;overflow:hidden}.sbs>div+div{border-left:1px solid var(--line)}
.thr{margin:6px 12px 10px 52px;padding:10px 12px;border-radius:12px;background:var(--s3);box-shadow:var(--spec);font-size:12.5px}
.thr .w{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:4px}.thr .w .m{font-weight:400;font-size:11.5px}
.sug{margin-top:8px;border-radius:9px;overflow:hidden;box-shadow:0 0 0 .5px var(--line2)}
.sug .h{display:flex;justify-content:space-between;padding:4px 10px;background:var(--s2);font-size:11px;color:var(--fg3)}
.prs{border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.ck{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px}.ck .mono{margin-left:auto;color:var(--fg3)}
.conv{padding:16px 18px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.cmt{display:flex;gap:10px}.cmt .bd{flex:1;background:var(--s2);border-radius:12px;padding:10px 12px;box-shadow:var(--spec)}
.cmt .bd .w{font-weight:600;margin-bottom:3px}.cmt .bd .w span{color:var(--fg3);font-weight:400;font-size:11.5px}

/* ===== repo ===== */
.repo{display:grid;grid-template-columns:1fr 320px;gap:14px;padding:16px;height:100%;overflow:auto;align-content:start}
.lbl{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid color-mix(in oklch,var(--c) 50%,transparent);color:var(--c)}
.md{padding:14px 16px;color:var(--fg2);font-size:13px}.md h3{margin:0 0 6px;color:var(--fg);font-size:18px}.md code{font:11.5px "JetBrains Mono";background:var(--s3);padding:1px 6px;border-radius:5px;color:var(--fg)}

/* ===== conflict ===== */
.cf{display:grid;grid-template-rows:auto 1fr auto;height:100%}
.cfh{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.cf3{display:grid;grid-template-columns:1fr 1.1fr 1fr;min-height:0}
.cf3>div{display:flex;flex-direction:column;min-height:0;overflow:hidden}.cf3>div+div{border-left:1px solid var(--line)}
.cpt{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:12px}
.cpt .rt{margin-left:auto}
.code{font:12px/1.8 "SF Mono","JetBrains Mono",monospace;overflow:auto;flex:1;padding:6px 0}
.code .l{display:grid;grid-template-columns:40px 1fr;white-space:pre;padding-right:10px}
.code .l i{font-style:normal;color:var(--fg3);text-align:right;padding-right:10px;opacity:.6}
.hunkc{margin:4px 8px;border-radius:9px;overflow:hidden;transition:.25s}
.hunkc.o{background:color-mix(in oklch,var(--blu) 13%,transparent);box-shadow:inset 3px 0 var(--blu)}
.hunkc.t{background:color-mix(in oklch,var(--pnk) 13%,transparent);box-shadow:inset 3px 0 var(--pnk)}
.hunkc.res{background:color-mix(in oklch,var(--grn) 12%,transparent);box-shadow:inset 3px 0 var(--grn)}
.hunkc.pend{background:color-mix(in oklch,var(--red) 10%,transparent);box-shadow:inset 3px 0 var(--red);border:1px dashed color-mix(in oklch,var(--red) 40%,transparent)}
.hact{display:flex;gap:6px;padding:4px 10px 6px 40px}
.cff{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line)}

/* ===== rebase ===== */
.rb{display:grid;grid-template-columns:1fr 320px;height:100%}
.rbl{padding:16px;overflow:auto}
.rbi{display:grid;grid-template-columns:22px 110px 1fr 80px 70px;gap:10px;align-items:center;padding:8px 12px;margin-bottom:6px;border-radius:12px;background:var(--s2);box-shadow:var(--spec),0 0 0 .5px var(--line);cursor:grab;transition:transform .25s var(--spring),opacity .2s}
.rbi.drag{opacity:.4}.rbi.over{transform:translateY(4px);box-shadow:0 -2px 0 var(--acc),var(--spec)}
.rbi.drop .msg{text-decoration:line-through;color:var(--fg3)}
.rbi .hdl{color:var(--fg3);cursor:grab}
.rbi select{background:var(--s3);border:0;color:var(--fg);border-radius:8px;padding:3px 6px;font:600 12px Inter;box-shadow:var(--spec)}
.rbi input{background:none;border:0;color:var(--fg);font:inherit;outline:none;width:100%}
.act-pick{color:var(--grn)!important}.act-reword{color:var(--blu)!important}.act-squash{color:var(--yel)!important}.act-fixup{color:var(--org)!important}.act-drop{color:var(--red)!important}

/* ===== blame ===== */
.bl{display:grid;grid-template-columns:230px 1fr 300px;height:100%}
.ftree{border-right:1px solid var(--line);overflow:auto;padding:8px}
.tn{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:7px;font-size:12.5px;color:var(--fg2);cursor:pointer}
.tn:hover{background:var(--s2)}.tn.on{background:var(--accs);color:var(--fg)}
.bcode{overflow:auto;font:12px/1.85 "SF Mono","JetBrains Mono",monospace}
.bln{display:grid;grid-template-columns:4px 190px 40px 1fr;align-items:center;white-space:pre;cursor:pointer}
.bln:hover{background:var(--s2)}.bln.on{background:var(--accs)}
.bln .heat{height:100%;background:var(--c)}
.bln .ba{display:flex;align-items:center;gap:6px;padding:0 10px;font:11.5px Inter;color:var(--fg3);overflow:hidden;border-right:1px solid var(--line);height:100%}
.bln .ba .av{width:15px;height:15px;font-size:8px}
.bln .ba.cont{color:transparent}.bln .ba.cont .av{visibility:hidden}
.bln i{font-style:normal;color:var(--fg3);text-align:right;padding-right:10px;opacity:.6}
.hist{border-left:1px solid var(--line);overflow:auto}
.hi{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);position:relative}
.hi.on{background:var(--accs)}
.hi::before{content:"";position:absolute;left:23px;top:0;bottom:0;width:2px;background:var(--line2)}
.hi .av{position:relative;z-index:1}

/* ===== inbox ===== */
.ib{display:grid;grid-template-columns:400px 1fr;height:100%}
.ibl{border-right:1px solid var(--line);overflow:auto}
.ibi{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:transform .3s,opacity .3s}
.ibi:hover{background:var(--s2)}.ibi.on{background:var(--accs)}
.ibi.unread::before{content:"";position:absolute;left:5px;top:20px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.ibi .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--s3)}
.ibi .tt{font-weight:600}.ibi .sb{font-size:11.5px;color:var(--fg3)}
.ibi .hov{position:absolute;right:10px;top:10px;display:none;gap:4px}.ibi:hover .hov{display:flex}
.ibi.gone{transform:translateX(40px);opacity:0}

/* ===== settings ===== */
.set{display:grid;grid-template-columns:200px 1fr;height:100%}
.setn{border-right:1px solid var(--line);padding:10px}
.setb{overflow:auto;padding:20px 28px;max-width:760px}
.setb h3{margin:22px 0 10px;font-size:13px;color:var(--fg3);font-weight:600}
.setb h3:first-child{margin-top:0}
.opt{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.opt:last-child{border:0}.opt .lb{flex:1}.opt .lb small{display:block;color:var(--fg3);font-size:11.5px}
.sw{width:38px;height:22px;border-radius:999px;background:var(--s4);position:relative;cursor:pointer;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 4px oklch(0 0 0 / .3);transition:.25s var(--spring)}
.sw.on{background:var(--grn)}.sw.on::after{left:18px}
input[type=range]{accent-color:var(--acc);width:180px}
.swatches{display:flex;gap:6px}.swatches i{width:22px;height:22px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 2px oklch(1 0 0 / .25)}

/* ===== compare ===== */

const S={screen:'launchpad',wt:'feat/auth-oauth',sel:1,repo:0,pr:482,agent:1,timers:[],filter:'all',inbox:0,blame:4,projectRailOpen:true,projectQuery:'',collapsedGroups:new Set()};
/* ================= PROJECT GROUPS ================= */
const GROUPS=[

  {id:'personal',n:'Personal',c:'oklch(.72 .16 155)',acct:{claude:'c-personal',codex:'x-personal'},path:'~/code/{repo}'},

function openProj(n){const p=PROJ.find(x=>x.n===n);if(!p)return;S.group=p.g;S.repo=n;closePop();renderStage();toast(`Opened ${p.o}/${n}`,p.g?'Grup '+curG().n:'Tanpa grup','◫')}

function searchProjects(value){S.projectQuery=value;renderProjectRail();const input=$('#projectSearch');if(input){input.focus();input.setSelectionRange(value.length,value.length)}}
function renderProjectRail(){
  const rail=$('#projectRail'),shell=$('.shell'),toggle=$('#projectRailToggle');if(!rail||!shell)return;
  shell.classList.toggle('projects-closed',!S.projectRailOpen);rail.hidden=!S.projectRailOpen;
  if(toggle)toggle.setAttribute('aria-pressed',String(S.projectRailOpen));
  if(!S.projectRailOpen)return;
  const q=S.projectQuery.trim().toLowerCase(),groups=[...GROUPS,{id:null,n:'Ungrouped',c:'var(--fg3)'}];
  const sections=groups.map(g=>{
    const projects=PROJ.filter(p=>p.g===g.id&&(`${p.o}/${p.n}`).toLowerCase().includes(q));
    if(q&&!projects.length)return'';
    const key=g.id||'ungrouped',collapsed=S.collapsedGroups.has(key);
    return `<section class="pr-group"><div class="pr-group-head"><button class="pr-collapse" aria-label="${collapsed?'Expand':'Collapse'} ${g.n}" aria-expanded="${!collapsed}" onclick="toggleProjectGroup('${key}')">${collapsed?'›':'⌄'}</button><button class="pr-group-toggle" title="Open ${g.n}" onclick="switchGroup('${g.id||''}')"><span class="pr-group-mark" style="background:${g.c}"></span><span class="pr-group-name">${g.n}</span><span class="pr-group-count">${projects.length}</span></button>${g.id?`<button class="pr-group-menu" title="Group settings" aria-label="Settings for ${g.n}" onclick="groupModal('${g.id}')">•••</button>`:''}</div>${collapsed?'':projects.map(p=>`<button class="pr-project ${p.n===S.repo?'on':''}" aria-current="${p.n===S.repo?'page':'false'}" title="${p.o}/${p.n}" onclick="openProj('${p.n}')"><span class="pr-project-mark" style="background:${p.c}">${p.n[0].toUpperCase()}</span><span class="pr-project-detail"><span class="pr-project-name">${p.n}</span><span class="pr-project-owner">${p.o}</span></span>${p.pr?`<span class="pr-prs">${p.pr}</span>`:''}</button>`).join('')||(!collapsed?'<div class="pr-empty">No projects yet</div>':'')}</section>`;
  }).join('');
  const active=curP(),group=GROUPS.find(g=>g.id===active.g);
  rail.innerHTML=`<div class="pr-head"><b>Projects</b><button class="ibtn" title="Add project" aria-label="Add project" onclick="addProj()">＋</button></div><div class="pr-search"><input class="in" id="projectSearch" aria-label="Search projects" placeholder="⌕ Search projects…" value="${S.projectQuery.replaceAll('"','&quot;')}" oninput="searchProjects(this.value)"></div><div class="pr-scroll">${sections||'<div class="pr-empty">No matching projects</div>'}</div><div class="project-context" title="${active.o}/${active.n}"><span class="project-context-mark" style="background:${group?.c||'var(--fg3)'}"></span><span class="project-context-group">${group?.n||'Ungrouped'}</span><span class="project-context-sep">/</span><span class="project-context-name">${active.n}</span></div><div class="pr-foot"><button class="btn sm" onclick="groupModal()">＋ Group</button><button class="btn sm" onclick="addProj()">＋ Project</button></div>`;
}
function closePop(){$('#ppop')?.remove()}
addEventListener('mousedown',e=>{if($('#ppop')&&!e.target.closest('#ppop,.gchip,#modal'))closePop()});
function projPop(){if($('#ppop'))return closePop();const d=document.createElement('div');d.className='ppop';d.id='ppop';

  <div class="pf"><button class="btn sm" onclick="groupModal()">＋ Grup baru</button><button class="btn sm" onclick="addProj()">＋ Tambah project</button><span class="m" style="margin-left:auto;font-size:11.5px;align-self:center">drag project ke grup lain</span></div>`;
  document.body.append(d);renderPop();setTimeout(()=>$('#pq').focus(),30)}
function renderPop(){const q=($('#pq')?.value||'').toLowerCase(),l=$('#plist2');if(!l)return;
  l.innerHTML=[...GROUPS,{id:null,n:'Tanpa grup',c:'var(--fg3)'}].map(g=>{const ps=PROJ.filter(p=>p.g===g.id&&(p.o+'/'+p.n).includes(q));if(q&&!ps.length)return'';const ac=g.acct&&g.acct.claude&&ACCTS.claude.find(a=>a.id===g.acct.claude);
   return `<div class="pg-sec ${g.id===S.group?'cur':''}" data-g="${g.id}"><div class="pg-h"><span class="sq" style="background:${g.c}"></span><b>${g.n}</b><span class="m">${ps.length}</span>${ac?`<span class="chip" title="Akun default Claude Code di grup ini">◔ ${ac.n}</span>`:''}<span style="flex:1"></span>${g.id&&g.id!==S.group?`<button onclick="switchGroup('${g.id}');renderPop()">Buka grup</button>`:''}${g.id?`<button title="Pengaturan grup" onclick="groupModal('${g.id}')">⋯</button>`:''}</div>
   ${ps.map(p=>`<div class="pg-r ${p.n===S.repo?'on':''}" draggable="true" data-p="${p.n}" onclick="openProj('${p.n}')"><i style="background:${p.c}">${p.n[0].toUpperCase()}</i><span><span class="m">${p.o}/</span><b>${p.n}</b></span>${p.pr?`<span class="chip">${p.pr} PR</span>`:''}<span class="m mono">${(g.path||'~/{repo}').replace('{repo}',p.n)}</span></div>`).join('')||'<div class="m" style="padding:6px 14px;font-size:12px">Drop project di sini</div>'}</div>`}).join('');
  let dr;$$('.pg-r').forEach(r=>{r.ondragstart=e=>{dr=r.dataset.p;r.classList.add('drag')};r.ondragend=()=>r.classList.remove('drag')});
  $$('.pg-sec').forEach(sec=>{sec.ondragover=e=>{e.preventDefault();sec.classList.add('over')};sec.ondragleave=()=>sec.classList.remove('over');
   sec.ondrop=e=>{e.preventDefault();sec.classList.remove('over');const p=PROJ.find(x=>x.n===dr),g=sec.dataset.g==='null'?null:sec.dataset.g;if(!p||p.g===g)return;p.g=g;if(p.n===S.repo&&g)S.group=g;renderPop();renderChrome();toast(`${p.n} dipindah`,'ke '+(g?GROUPS.find(x=>x.id===g).n:'Tanpa grup'),'▣')}})}
async function addProj(){closePop();const v=await ask({title:'Tambah project ke '+curG().n,body:'Clone dari GitHub (owner/repo) atau buka folder lokal.',icon:'⇣',ok:'Tambah',input:'acme/mobile-app',placeholder:'owner/repo atau ~/path'});if(!v)return;const [o,n]=v.includes('/')&&!v.startsWith('~')?v.split('/'):['local',v.split('/').pop()];
  PROJ.push({n,o,g:S.group,c:GSW[PROJ.length%GSW.length]});openProj(n);toast(`Cloning ${o}/${n}…`,'ke '+curG().path.replace('{repo}',n),'⇣')}

  <div class="h4" style="margin-top:14px">LOKASI CLONE / WORKTREE</div><input class="in mono" id="gp" value="${g.path}">
  ${id?`<div class="h4" style="margin-top:14px">PROJECT · ${PROJ.filter(p=>p.g===id).length}</div><div style="display:flex;gap:6px;flex-wrap:wrap">${PROJ.filter(p=>p.g===id).map(p=>`<span class="chip">${p.n}</span>`).join('')}</div>`:''}
  <div style="display:flex;gap:8px;margin-top:20px">${id?`<button class="btn ghost" style="color:var(--red)" onclick="delGroup('${id}')">Hapus grup</button>`:''}<span style="flex:1"></span><button class="btn" onclick="closeModal()">Batal</button><button class="btn p" onclick="saveGroup(${id?`'${id}'`:'null'})">${id?'Simpan':'Buat grup'}</button></div>`)}
function saveGroup(id){const n=$('#gn').value.trim();if(!n)return $('#gn').focus();let g=GROUPS.find(x=>x.id===id);
  if(!g){g={id:n.toLowerCase().replace(/[^a-z0-9]+/g,'-'),acct:{}};GROUPS.push(g)}
  Object.assign(g,{n,c:$('input[name=gc]:checked').value,path:$('#gp').value,acct:{claude:$('#ga-claude').value||undefined,codex:$('#ga-codex').value||undefined}});
  closeModal();renderChrome();toast(id?'Grup disimpan':'Grup dibuat: '+n,id?n:'Drag project ke grup ini lewat switcher','▣',id?null:['Buka',()=>projPop()])}
async function delGroup(id){const g=GROUPS.find(x=>x.id===id),ps=PROJ.filter(p=>p.g===id);if(!await ask({title:'Hapus grup '+g.n+'?',body:ps.length+' project di dalamnya pindah ke <b>Tanpa grup</b>. Repository tidak dihapus.',ok:'Hapus grup',danger:1,icon:'▣'}))return;ps.forEach(p=>p.g=null);GROUPS.splice(GROUPS.indexOf(g),1);if(S.group===id)S.group=GROUPS[0].id;closeModal();renderChrome();

const ciI=c=>c==='ok'?'<span class="g" title="CI passed">✓</span>':c==='fail'?'<span class="r" title="CI failed">✕</span>':c==='run'?'<span class="spin" title="CI running"></span>':'';
function toast(msg,sub,ic='✓',action){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<div class="ti">${ic}</div><div class="tb">${msg}${sub?`<small>${sub}</small>`:''}</div>${action?`<button class="btn sm">${action[0]}</button>`:''}`;
  if(action)t.querySelector('button').onclick=()=>{action[1]();kill()};
  $('#toasts').append(t);const kill=()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)};setTimeout(kill,4200);
}

function graphSVG(){
  const H=36,X=l=>20+l*24,Y=i=>i*H+H/2;let e='',n='';
  commits.forEach((c,i)=>{c.p.forEach((pi,k)=>{const q=commits[pi],x1=X(c.l),y1=Y(i),x2=X(q.l),y2=Y(pi),col=LC[k?q.l:c.l];let d;
    if(x1===x2)d=`M${x1} ${y1}V${y2}`;else if(k===0)d=`M${x1} ${y1}V${y2-H}C${x1} ${y2-H*.35} ${x2} ${y2-H*.65} ${x2} ${y2}`;else d=`M${x1} ${y1}C${x1} ${y1+H*.65} ${x2} ${y1+H*.35} ${x2} ${y1+H}V${y2}`;
    e+=`<path class="edge ${c.wip?'wip':''}" pathLength="1" d="${d}" stroke="${col}" style="animation-delay:${i*40}ms"/>`});
    const x=X(c.l),y=Y(i);
    n+=c.wip?`<circle class="node" cx="${x}" cy="${y}" r="6" fill="var(--surf)" stroke="${LC[c.l]}" stroke-width="2" stroke-dasharray="3 2"/>`
      :`<g class="node" style="animation-delay:${i*40}ms;transform-origin:${x}px ${y}px"><circle cx="${x}" cy="${y}" r="9.5" fill="${P[c.a][1]}" stroke="oklch(.16 .01 var(--bh))" stroke-width="2.5"/><text x="${x}" y="${y+3.5}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff" font-family="Inter">${c.a==='claude'?'✦':P[c.a][0][0]}</text></g>`});
  return `<svg class="lanes" width="140" height="${commits.length*H+60}">${e}${n}</svg>`;
}

import { session } from "@/lib/session"
import { redirect } from "next/navigation"

/**
 * OAuth callback handler.
 * GitHub redirects here with ?code=... after the user
 * authorizes the app. We exchange the code for a token,
 * store it in an httpOnly session cookie and send the
 * user to their account page.
 */
export async function GET(req: Request) {
  const url = new URL(req.url)
  const code = url.searchParams.get("code")
  if (!code) return redirect("/login?error=missing_code")

  // Exchange the OAuth code for an access token
  const token = await gh.exchange(code)
  await session.set(token)
  return redirect("/account")
}
