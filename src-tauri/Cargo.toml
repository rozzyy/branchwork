[package]
name = "branchwork"
version = "0.2.0"
description = "Branchwork: multi-worktree Git client"
authors = ["rozzyVive"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "branchwork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
git2 = "0.21.0"
tauri-plugin-dialog = "2.8.4"
notify = "8"
tauri-specta = { version = "2.0.0-rc.26", features = ["derive", "typescript"] }
specta = { version = "2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0.13"
# Delete-to-Trash backend (Task 09). Pinned to the 5.3 minor line so an upstream minor bump
# cannot change Trash behavior under us without a deliberate Cargo.toml edit.
trash = "~5.3.0"
portable-pty = "0.9"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
